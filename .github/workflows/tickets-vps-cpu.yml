name: Profile current isolated Tickets wallet CPU
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-cpu.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tickets-vps-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 79fa5e68f9e7d5b90cf5f47a8bea9e0ac95c84d4
      SOURCE_RUN: '36492808138'
    steps:
      - name: Check out exact Tickets source for isolated verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: 79fa5e68f9e7d5b90cf5f47a8bea9e0ac95c84d4
          persist-credentials: false
          path: tickets-source
      - name: Profile synthetic server only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tickets-source/scripts/verify-vps-capacity.mjs')
          s=p.read_text().replace("process.execPath, path.resolve('dist-vps/server.mjs')", "process.execPath, '--cpu-prof', '--cpu-prof-dir='+directory, path.resolve('dist-vps/server.mjs')")
          replacement="""finally {await stop();
            for(const file of readdirSync(directory).filter(f=>f.endsWith('.cpuprofile'))) {
              const profile=JSON.parse(readFileSync(path.join(directory,file),'utf8'));
              console.log(JSON.stringify({syntheticCpuProfile:profile.nodes.filter(n=>n.hitCount).sort((a,b)=>b.hitCount-a.hitCount).slice(0,35).map(n=>({function:n.callFrame.functionName,file:path.basename(n.callFrame.url),line:n.callFrame.lineNumber,hits:n.hitCount}))}));
            }
          """
          s=s.replace("finally {await stop();",replacement)
          p.write_text(s)
          PY
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Transfer isolated real-network rehearsal
        run: |
          tar -C tickets-source -cf - scripts/verify-vps-runtime.mjs scripts/verify-vps-capacity.mjs runtime/vps/database.mjs | tailscale ssh root@hermes "umask 077; mkdir -p /srv/becore-tickets/temporary/rehearsal-$SOURCE_SHA; tar -xf - -C /srv/becore-tickets/temporary/rehearsal-$SOURCE_SHA"
          tailscale ssh root@hermes "bash -s -- '$SOURCE_SHA'" <<'REMOTE'
          set -euo pipefail
          revision=$1
          stage="/srv/becore-tickets/temporary/rehearsal-$revision"
          trap 'rm -rf "$stage"' EXIT
          ln -s "/srv/becore-tickets/releases/$revision" "$stage/dist-vps"
          ln -s "/srv/becore-tickets/releases/$revision/node_modules" "$stage/node_modules"
          ln -s "/srv/becore-tickets/releases/$revision/migrations" "$stage/drizzle"
          chown -hR becore-tickets:becore-tickets "$stage"
          cd "$stage"
          runuser -u becore-tickets -- "/srv/becore-tickets/releases/$revision/bin/node" scripts/verify-vps-runtime.mjs
          TICKETS_REHEARSAL_SYSTEMD=1 "/srv/becore-tickets/releases/$revision/bin/node" scripts/verify-vps-capacity.mjs
          REMOTE
