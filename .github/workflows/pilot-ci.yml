name: Pilot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated Worker bindings
        run: npm run cf:types
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Full dependency audit
        run: npm run audit:full
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Production build
        run: npm run build
      - name: Validate Worker package
        run: npm run deploy:dry-run
      - name: Verify required production routes
        run: npm run verify:routes
