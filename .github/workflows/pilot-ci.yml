name: Pilot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.BUBBLEWASH_CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure CI database
        run: echo "BUBBLEWASH_DATABASE_PATH=$RUNNER_TEMP/bubblewash-ci.sqlite" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Production build
        run: npm run build
      - name: Verify required production routes
        run: npm run verify:routes
