name: Add approved Bubble Wash staff HTTPS route
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit for exact additive staff HTTPS route
        required: true
        type: string
      check_only:
        description: Prove the exact route delta without activation
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: bubblewash-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/bubble-wash' && github.ref == 'refs/heads/main'
    environment: backup-storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CHECK_ONLY: ${{ inputs.check_only }}
    steps:
      - name: Require exact reviewed source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test exact additive route guard
        run: python3 -B -m unittest discover -s tests -p 'test_add_staff_host.py' -v
      - name: Connect through existing approved production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Check or activate only the approved exact staff hostname
        run: |
          set -euo pipefail
          case "$CHECK_ONLY" in
            true) tailscale ssh root@hermes 'python3 -I -B - --check-only' < ops/add-staff-host.py ;;
            false) tailscale ssh root@hermes 'python3 -I -B - --activate' < ops/add-staff-host.py ;;
            *) exit 1 ;;
          esac
