name: Encrypted Read-Only Host Facts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubblewash-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/bubble-wash' && github.ref == 'refs/heads/main'
    environment: backup-storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test bounded inspection and encryption without host access
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_php_inventory.py' -v
          python3 -B -m unittest discover -s tests -p 'test_host_facts.py' -v
          node --test tests/host-facts-crypto.test.mjs
      - name: Verify existing private destination before host access
        env:
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
          BACKUP_STORE_SHA: ${{ vars.BACKUP_STORE_SHA }}
          BACKUP_STORE_ID: ${{ vars.BACKUP_STORE_ID }}
        run: python3 .github/backup/check_store.py
      - name: Use existing approved production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Collect metadata read-only and retain encrypted private report
        env:
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
          BACKUP_STORE_SHA: ${{ vars.BACKUP_STORE_SHA }}
          BACKUP_STORE_ID: ${{ vars.BACKUP_STORE_ID }}
        run: python3 -B ops/host-facts/transport.py inspect
