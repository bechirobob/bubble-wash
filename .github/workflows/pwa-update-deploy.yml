name: Separate customer and staff home-screen apps
run-name: Home-screen app update ${{ inputs.runtime_sha }}
on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact reviewed runtime commit with the pinned separate home-screen app tree
        required: true
        type: string
      browser_run:
        description: Successful first-attempt exact-runtime Browser regression push or manual run
        required: true
        type: string
      ci_run:
        description: Successful first-attempt exact-runtime Pilot CI push or manual run
        required: true
        type: string
      backup_sha256:
        description: Latest verified encrypted archive SHA256, matching the current receipt
        required: true
        type: string
      receipt_run:
        description: Matching verified backup run, at most 30 hours old
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bubblewash-production
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'bechirobob/bubble-wash' && github.ref == 'refs/heads/main'
    environment: backup-storage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNTIME_SHA: ${{ inputs.runtime_sha }}
      BROWSER_RUN: ${{ inputs.browser_run }}
      CI_RUN: ${{ inputs.ci_run }}
      BACKUP_SHA: ${{ inputs.backup_sha256 }}
      RECEIPT_RUN: ${{ inputs.receipt_run }}
      BACKUP_STORE_SHA: ${{ vars.BACKUP_STORE_SHA }}
      BACKUP_STORE_ID: ${{ vars.BACKUP_STORE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.runtime_sha }}
          persist-credentials: false
          path: runtime-artifact
      - name: Bind exact controls and complete separately reviewed runtime
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$RUNTIME_SHA" =~ ^[a-f0-9]{40}$ && "$(git -C runtime-artifact rev-parse HEAD)" == "$RUNTIME_SHA" ]]
          [[ "$BACKUP_SHA" =~ ^[a-f0-9]{64}$ && "$RECEIPT_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_STORE_SHA" =~ ^[a-f0-9]{40}$ && "$BACKUP_STORE_ID" =~ ^[1-9][0-9]*$ ]]
          python3 -B ops/deploy-pwa-update.py --check-runtime
          python3 -B -m unittest discover -s tests -p 'test_pwa_update_deploy.py' -v
          python3 -B ops/deploy-pwa-update.py --check-hosted-runs
          python3 -B ops/deploy-pwa-update.py --emit > "$RUNNER_TEMP/pwa-update.py"
      - name: Verify existing private backup destination without creating access
        env:
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
        run: python3 .github/backup/check_store.py
      - name: Connect through existing approved production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Stage only the exact runtime as the existing application UID
        run: |
          set -euo pipefail
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${RUNTIME_SHA:0:12}"
          release_dir="/home/ubuntu/bubblewash-releases/$release_id"
          git -C runtime-artifact archive --format=tar "$RUNTIME_SHA" > "$RUNNER_TEMP/pwa-update.tar"
          tailscale ssh root@hermes "/usr/sbin/runuser -u ubuntu -- /usr/bin/python3 -I -c \"import os,pathlib,stat; p=pathlib.Path('$release_dir'); a=p.parent; s=a.lstat(); assert a.resolve(strict=True)==a and stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid() and not s.st_mode & 0o022; p.mkdir(mode=0o750); assert p.resolve(strict=True)==p\""
          tailscale ssh root@hermes "/usr/sbin/runuser -u ubuntu -- /bin/sh -c \"umask 077; /usr/bin/tar --no-same-owner -xf - -C '$release_dir' && test ! -e '$release_dir/.release-sha' && printf '%s\\n' '$RUNTIME_SHA' > '$release_dir/.release-sha'\"" < "$RUNNER_TEMP/pwa-update.tar"
          printf 'RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"
      - name: Build, rehearse unchanged copies, and switch code with unchanged current configuration and holds
        run: |
          set -euo pipefail
          tailscale ssh root@hermes "python3 -I -B - --candidate '$RELEASE_DIR' --sha '$RUNTIME_SHA' --expected-live '1ddf328332836aeefe41d4a4e6f05ed79d4589a3' --backup-sha256 '$BACKUP_SHA' --receipt-run '$RECEIPT_RUN' --store-sha '$BACKUP_STORE_SHA' --store-id '$BACKUP_STORE_ID'" < "$RUNNER_TEMP/pwa-update.py"
