name: Inspect phased Tickets return digests on Hermes
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-return-upload.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: 1978b651c41fff11bdb39681fd39222714e1612b
          persist-credentials: false
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Read only aggregate phase digests from private standby
        run: |
          set -euo pipefail
          tar -cf - ops/handover/sqlite-export.mjs ops/handover/return-metadata.mjs | tailscale ssh root@hermes 'umask 077; mkdir /var/tmp/tickets-phase-metadata-1978b651; tar -xf - -C /var/tmp/tickets-phase-metadata-1978b651'
          tailscale ssh root@hermes 'bash -s' <<'REMOTE'
          set -euo pipefail
          stage=/var/tmp/tickets-phase-metadata-1978b651
          trap 'rm -rf "$stage"' EXIT
          cd "$stage"
          /srv/becore-tickets/current/bin/node ops/handover/return-metadata.mjs --inspect
          REMOTE
