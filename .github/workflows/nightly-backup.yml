name: Nightly Production Backup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nightly-backup.yml
      - .github/backup/**
      - scripts/backup-database.mjs
      - scripts/finalize-backup.mjs
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubblewash-production
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'bechirobob/bubble-wash' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    name: Back up and restore-test production data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify encrypted backup transport before host access
        run: python3 -m unittest discover -s .github/backup -p 'test_*.py' -v
      - name: Connect to the production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes

      - name: Create and restore-test the encrypted backup
        shell: bash
        run: |
          set -euo pipefail
          # Use supported, per-run preservation only for recovery/verification.
          # Ordinary scheduled runs retain their configured local retention.
          retention=""
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            tailscale ssh root@hermes 'python3 -' <<'PYPRESERVE'
          import json,pathlib,re,time
          root=pathlib.Path('/home/ubuntu/bubblewash-backups')
          candidates=[]
          for path in root.rglob('*.enc'):
            if re.fullmatch(r'bubblewash-[0-9TZ.:-]+\.sqlite\.enc',path.name):
              assert path.is_file() and not path.is_symlink()
              if path.stat().st_mtime < time.time()-365*86400: candidates.append(str(path))
          print('BECORE_BACKUP_PRESERVATION '+json.dumps({'olderThan365Days':candidates}))
          assert not candidates,'Existing encrypted files require preservation before recovery.'
          PYPRESERVE
            retention="BUBBLEWASH_BACKUP_PRIMARY_RETENTION_DAYS=365 BUBBLEWASH_BACKUP_STAGING_RETENTION_DAYS=365"
          fi
          unit_name="bubblewash-nightly-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup_output="$(tailscale ssh root@hermes \
            "systemd-run --quiet --wait --collect --pipe --unit='$unit_name' --property='User=ubuntu' --property='Group=ubuntu' --property='WorkingDirectory=/home/ubuntu/bubblewash-pilot' --property='EnvironmentFile=/home/ubuntu/.config/bubblewash/env' --property='Environment=HOME=/home/ubuntu' /usr/bin/env $retention BUBBLEWASH_BACKUP_DEFER_STATUS=true /usr/bin/npm run db:backup")"

          backup_name="$(printf '%s\n' "$backup_output" | python3 -c 'import json,sys; text=sys.stdin.read(); value=json.loads(text[text.index("{"):]); assert value["ok"]; print(value["filename"])')"
          if [[ ! "$backup_name" =~ ^bubblewash-[0-9TZ.:-]+\.sqlite\.enc$ ]]; then
            echo "The nightly backup name is invalid." >&2
            exit 1
          fi
          printf 'BACKUP_NAME=%s\n' "$backup_name" >> "$GITHUB_ENV"

      - name: Export the encrypted backup from the VPS
        shell: bash
        run: |
          set -euo pipefail
          backup_path="$RUNNER_TEMP/$BACKUP_NAME"
          tailscale ssh root@hermes \
            "cat '/home/ubuntu/bubblewash-backups/github-staging/$BACKUP_NAME'" \
            > "$backup_path"
          [[ -s "$backup_path" ]]
          chmod 0600 "$backup_path"
          printf 'BACKUP_PATH=%s\n' "$backup_path" >> "$GITHUB_ENV"

      - name: Publish and download-verify encrypted private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PROJECT: bubblewash
        run: python3 .github/backup/backup_release.py
      - name: Record durable verified off-host receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(base64 -w0 "$RUNNER_TEMP/offhost-release-receipt.json")"
          [[ "$receipt" =~ ^[A-Za-z0-9+/=]+$ ]]
          tailscale ssh root@hermes "python3 - '$receipt'" <<'PYRECEIPT'
          import base64,hashlib,json,os,pathlib,re,sys,tempfile
          raw=base64.b64decode(sys.argv[1],validate=True)
          proof=json.loads(raw)
          assert proof['schema']=='becore-encrypted-backup-release/v1'
          assert proof['repository']=='bechirobob/bubble-wash'
          assert proof['encrypted'] is True and proof['restoreTested'] is True and proof['downloadVerified'] is True
          assert re.fullmatch(r'bubblewash-[0-9TZ.:-]+\.sqlite\.enc',proof['filename'])
          source=pathlib.Path('/home/ubuntu/bubblewash-backups/github-staging')/proof['filename']
          digest=hashlib.sha256()
          with source.open('rb') as handle:
            for block in iter(lambda:handle.read(1024*1024),b''): digest.update(block)
          assert digest.hexdigest()==proof['sha256'] and source.stat().st_size==proof['size']
          path=pathlib.Path('/home/ubuntu/bubblewash-backups/offhost-release.json')
          with tempfile.NamedTemporaryFile(dir=path.parent,prefix='.offhost-receipt-',delete=False) as handle:
            handle.write(raw);handle.flush();os.fsync(handle.fileno())
            temporary=handle.name
          os.chmod(temporary,0o600)
          os.replace(temporary,path)
          assert json.loads(path.read_bytes())==proof
          print('BECORE_BACKUP_DURABLE_RECEIPT '+json.dumps(proof,sort_keys=True))
          PYRECEIPT

      - name: Confirm off-host storage after download verification
        shell: bash
        run: |
          set -euo pipefail
          unit_name="bubblewash-backup-finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tailscale ssh root@hermes \
            "systemd-run --quiet --wait --collect --pipe --unit='$unit_name' --property='User=ubuntu' --property='Group=ubuntu' --property='WorkingDirectory=/home/ubuntu/bubblewash-pilot' --property='EnvironmentFile=/home/ubuntu/.config/bubblewash/env' --property='Environment=HOME=/home/ubuntu' /usr/bin/npm run db:backup:finalize -- '$BACKUP_NAME'"

      - name: Verify production readiness
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 https://bubblewash.co/api/ready

