name: Install Tickets fallback page
on:
  push:
    branches: [ops/inspect-tickets-fallback]
    paths: [.github/workflows/install-tickets-fallback.yml]
permissions:
  contents: read
concurrency:
  group: hermes-tickets-fallback
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: dc4c0b4ad1ef31ad2e58b8210a35d6bac0ca2b0c
          persist-credentials: false
      - name: Verify isolated fallback behavior
        run: python3 -m unittest discover -s ops/fallback -p 'test_*.py' -v
      - name: Build self-contained page
        run: node ops/fallback/build.mjs
      - name: Connect to the existing VPS
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Record existing site's response before the reload
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, pathlib
          try: r=urllib.request.urlopen('https://bubblewash.co/',timeout=20)
          except urllib.error.HTTPError as e: r=e
          with r: pathlib.Path('/tmp/bubblewash-before-status').write_text(str(r.status))
          PY
      - name: Install isolated page and validate Caddy before reloading
        run: |
          set -euo pipefail
          source_revision=dc4c0b4ad1ef31ad2e58b8210a35d6bac0ca2b0c
          staging="/srv/becore-tickets-fallback/.staging/$source_revision"
          cp ops/fallback/install-host.py dist/fallback/install-host.py
          tailscale ssh root@hermes "install -d -m 0700 '$staging'"
          tar -C dist/fallback -czf - . | tailscale ssh root@hermes "tar -xzf - -C '$staging'"
          tailscale ssh root@hermes "python3 '$staging/install-host.py' '$staging' '$source_revision'"
      - name: Verify page and shared host
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time, pathlib
          def get(url, method='GET'):
              try: r=urllib.request.urlopen(urllib.request.Request(url, method=method),timeout=20)
              except urllib.error.HTTPError as e: r=e
              with r: return r.status, r.headers, r.read(65536)
          for attempt in range(12):
              try:
                  status, headers, body=get('https://tickets-status.becoreops.com/healthz')
                  if status == 200: break
              except (OSError, urllib.error.URLError):
                  if attempt == 11: raise
              time.sleep(5)
          assert status == 200 and body.strip() == b'becore-tickets-fallback-ready'
          status, headers, body=get('https://tickets-status.becoreops.com/')
          assert status == 503 and b'We\xe2\x80\x99ll be back shortly.' in body
          assert headers.get('Cache-Control') == 'no-store, max-age=0'
          status, headers, body=get('https://tickets-status.becoreops.com/api/test', 'POST')
          assert status == 503 and b'temporarily_unavailable' in body
          assert headers.get('Content-Type') == 'application/json'
          status, _, _=get('https://bubblewash.co/')
          before=int(pathlib.Path('/tmp/bubblewash-before-status').read_text())
          assert status == before, f'Existing site changed HTTP response: {before} -> {status}'
          print(f'Fallback page and API behavior verified. Existing site HTTP response preserved: {status}.')
          PY
      - name: Activate automatic switching when the private connection is available
        env:
          FALLBACK_TOKEN: ${{ secrets.TICKETS_FALLBACK_CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FALLBACK_TOKEN" ]; then
            echo 'Page verified. Automatic switching is inactive: TICKETS_FALLBACK_CLOUDFLARE_TOKEN is missing.'
            exit 0
          fi
          python3 - <<'PY' | tailscale ssh root@hermes 'python3 /srv/becore-tickets-fallback/current/activate-monitor.py'
          import json, os
          print(json.dumps({
              'CLOUDFLARE_API_TOKEN': os.environ['FALLBACK_TOKEN'].strip(),
              'CLOUDFLARE_ZONE_ID': 'bbf0174f839a0d22dbf6d9f4bd3cf53d',
              'CLOUDFLARE_FALLBACK_RULESET_ID': 'c2e81ba1a73248c0a2974c1fc6889e28',
              'CLOUDFLARE_FALLBACK_RULE_ID': '33ad93cad5f1407bb22bd3cca2686db5'
          }))
          PY
