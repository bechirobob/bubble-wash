name: Install Tickets fallback page
on:
  push:
    branches: [ops/inspect-tickets-fallback]
    paths: [.github/workflows/install-tickets-fallback.yml]
permissions:
  contents: read
concurrency:
  group: hermes-tickets-fallback
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: 001bae4fa47b85a8c486b172d3dcea1b3c2a2080
          persist-credentials: false
      - name: Verify isolated fallback behavior
        run: python3 -m unittest discover -s ops/fallback -p 'test_*.py' -v
      - name: Build self-contained page
        run: node ops/fallback/build.mjs
      - name: Connect to the existing VPS
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Install isolated page and validate Caddy before reloading
        run: |
          set -euo pipefail
          source_revision=001bae4fa47b85a8c486b172d3dcea1b3c2a2080
          staging="/srv/becore-tickets-fallback/.staging/$source_revision"
          cp ops/fallback/install-host.py dist/fallback/install-host.py
          tailscale ssh root@hermes "install -d -m 0700 '$staging'"
          tar -C dist/fallback -czf - . | tailscale ssh root@hermes "tar -xzf - -C '$staging'"
          tailscale ssh root@hermes "python3 '$staging/install-host.py' '$staging' '$source_revision'"
      - name: Verify page and shared host
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          def get(url, method='GET'):
              try: r=urllib.request.urlopen(urllib.request.Request(url, method=method),timeout=20)
              except urllib.error.HTTPError as e: r=e
              with r: return r.status, r.headers, r.read(65536)
          status, headers, body=get('https://tickets-status.becoreops.com/healthz')
          assert status == 200 and body.strip() == b'becore-tickets-fallback-ready'
          status, headers, body=get('https://tickets-status.becoreops.com/')
          assert status == 503 and b'We\xe2\x80\x99ll be back shortly.' in body
          assert headers.get('Cache-Control') == 'no-store, max-age=0'
          status, headers, body=get('https://tickets-status.becoreops.com/api/test', 'POST')
          assert status == 503 and b'temporarily_unavailable' in body
          assert headers.get('Content-Type') == 'application/json'
          status, _, _=get('https://bubblewash.co/')
          assert status == 200
          print('Public fallback page, non-success API response, and existing Bubble Wash homepage verified.')
          PY
