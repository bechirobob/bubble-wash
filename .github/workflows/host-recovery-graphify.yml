name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Prepare dedicated key for authorized Parrot SSH
        run: |
          timeout 30 tailscale ssh root@hermes 'bash -s' <<'SH'
          set -euo pipefail
          install -d -m 0700 /root/.ssh
          key=/root/.ssh/parrot-assistance-ed25519
          if [ ! -f "$key" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'hermes-parrot-assistance' -f "$key"
          fi
          test -f "$key.pub"
          chmod 0600 "$key"
          ssh-keygen -lf "$key.pub"
          cat "$key.pub"
          SH
