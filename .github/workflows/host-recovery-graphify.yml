name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify Parrot through dedicated Hermes SSH key
        run: |
          timeout 60 tailscale ssh root@hermes 'bash -s' <<'HERMES'
          set -euo pipefail
          ssh -i /root/.ssh/parrot-assistance-ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 bechirob@100.74.152.91 'bash -s' <<'PARROT'
          set -euo pipefail
          test "$(hostname)" = parrot
          test "$(id -un)" = bechirob
          hostname
          id -un
          cat /etc/os-release
          systemctl is-active ssh tailscaled
          systemctl is-enabled ssh
          python3 --version
          command -v codex uv pipx graphify || true
          for path in "$HOME/.local/bin/graphify" "$HOME/.local/bin/codex" /usr/sbin/sshd; do
            if [ -x "$path" ]; then printf 'AVAILABLE %s\n' "$path"; fi
          done
          python3 -c 'import venv,ensurepip; print("PYTHON_VENV_READY")' || true
          if sudo -n true 2>/dev/null; then echo SUDO_NONINTERACTIVE=yes; else echo SUDO_NONINTERACTIVE=no; fi
          if [ -x "$HOME/.local/bin/graphify" ]; then "$HOME/.local/bin/graphify" --version; fi
          PARROT
          HERMES
