name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Register Graphify and verify a local code graph
        run: |
          timeout 120 tailscale ssh root@hermes 'bash -s' <<'ROOT'
          set -euo pipefail
          runuser -u ubuntu -- bash -s <<'USER'
          set -euo pipefail
          cd /home/ubuntu
          export PATH="/home/ubuntu/.local/bin:$PATH"
          graphify install --platform codex
          graphify install --platform agents
          test -s .codex/skills/graphify/SKILL.md
          test -s .agents/skills/graphify/SKILL.md
          .local/share/graphify/venv/bin/python - <<'PY'
          import importlib.metadata,json,pathlib,subprocess,tempfile
          assert importlib.metadata.version('graphifyy')=='0.9.74'
          with tempfile.TemporaryDirectory(prefix='graphify-smoke-') as directory:
              root=pathlib.Path(directory)
              (root/'sample.py').write_text('def double(x):\n    return x * 2\n\ndef total(x):\n    return double(x) + 1\n')
              subprocess.run(['/home/ubuntu/.local/bin/graphify','extract',str(root),'--code-only','--no-cluster','--max-workers','1'],check=True,timeout=60)
              graph=json.loads((root/'graphify-out/graph.json').read_text())
              nodes=graph.get('nodes',[])
              edges=graph.get('links',graph.get('edges',[]))
              assert len(nodes)>=2 and edges,(len(nodes),len(edges))
              assert any('double' in str(n.get('label','')) for n in nodes)
              print('GRAPHIFY_SMOKE_OK',json.dumps({'version':'0.9.74','nodes':len(nodes),'edges':len(edges),'codexSkill':True,'agentSkill':True}))
          PY
          USER
          systemctl is-active tailscaled ssh caddy becore-tickets
          ROOT
