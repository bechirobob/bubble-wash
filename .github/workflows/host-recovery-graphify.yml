name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Inspect Codex plugin registration and verify Graphify on Parrot
        run: |
          timeout 120 tailscale ssh root@hermes 'bash -s' <<'HERMES'
          set -euo pipefail
          ssh -i /root/.ssh/parrot-assistance-ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 bechirob@100.74.152.91 'bash -s' <<'PARROT'
          set -euo pipefail
          test "$(hostname)" = parrot
          export PATH="$HOME/.local/bin:$PATH"
          codex --version
          codex plugin --help
          codex plugin list || true
          graphify install --platform codex
          graphify install --platform agents
          graphify --version
          python3 - <<'PY'
          import json,pathlib,subprocess,tempfile
          with tempfile.TemporaryDirectory(prefix='graphify-smoke-') as directory:
              root=pathlib.Path(directory)
              (root/'sample.py').write_text('def double(x):\n    return x * 2\n\ndef total(x):\n    return double(x) + 1\n')
              subprocess.run(['graphify','extract',str(root),'--code-only','--no-cluster','--max-workers','1'],check=True,timeout=60)
              graph=json.loads((root/'graphify-out/graph.json').read_text())
              nodes=graph.get('nodes',[])
              edges=graph.get('links',graph.get('edges',[]))
              assert len(nodes)>=2 and edges,(len(nodes),len(edges))
              assert any('double' in str(n.get('label','')) for n in nodes)
              home=pathlib.Path.home()
              assert (home/'.codex/skills/graphify/SKILL.md').is_file()
              assert (home/'.agents/skills/graphify/SKILL.md').is_file()
              print('PARROT_GRAPHIFY_SMOKE_OK',json.dumps({'nodes':len(nodes),'edges':len(edges),'codexSkill':True,'agentSkill':True}))
          PY
          PARROT
          HERMES
