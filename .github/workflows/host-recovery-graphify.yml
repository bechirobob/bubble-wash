name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Install and verify the existing Ponytail bundle
        run: |
          timeout 45 tailscale ssh root@hermes 'runuser -u ubuntu -- python3 -' <<'PY'
          import base64,hashlib,json,pathlib,os,zlib
          blob=base64.b64decode('',validate=True)
          assert hashlib.sha256(blob).hexdigest()=='f648fb852691a76e5494d127580d72b81375669913c4de3990ea3a232bf41dc9'
          files=json.loads(zlib.decompress(blob))
          home=pathlib.Path.home()
          root=home/'.local/share/ponytail/2.0.0'
          skills=home/'.codex/skills'
          planned=[]
          for name,encoded in files.items():
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              target=root.joinpath(*rel.parts)
              data=base64.b64decode(encoded,validate=True)
              if target.exists():
                  assert target.is_file() and target.read_bytes()==data,'Existing different Ponytail file: '+str(target)
              planned.append((target,data))
          names=["code-simplification","entry-ponytail","ponytail","ponytail-audit","ponytail-debt","ponytail-gain","ponytail-help","ponytail-review"]
          for name in names:
              dest=skills/name
              source=root/'skills'/name
              if dest.exists() or dest.is_symlink():
                  assert (dest/'SKILL.md').is_file(),'Existing skill needs inspection: '+name
                  assert (dest/'SKILL.md').read_bytes()==base64.b64decode(files['skills/'+name+'/SKILL.md']),'Existing different skill: '+name
          for target,data in planned:
              target.parent.mkdir(parents=True,exist_ok=True)
              if not target.exists():
                  with target.open('xb') as handle: handle.write(data)
          skills.mkdir(parents=True,exist_ok=True)
          for name in names:
              dest=skills/name
              if not dest.exists() and not dest.is_symlink():
                  dest.symlink_to(root/'skills'/name,target_is_directory=True)
              data=(dest/'SKILL.md').read_bytes()
              assert data==base64.b64decode(files['skills/'+name+'/SKILL.md'])
          print('PONYTAIL_INSTALL_OK '+json.dumps({'version':'2.0.0','user':home.name,'skills':names,'verifiedFiles':len(files),'payloadSha256':'f648fb852691a76e5494d127580d72b81375669913c4de3990ea3a232bf41dc9'}))
          
          PY
      - name: Check Parrot remote access
        run: |
          timeout 8 tailscale ping --c 1 --timeout 3s 100.74.152.91 || true
          timeout 5 bash -c 'cat < /dev/null > /dev/tcp/100.74.152.91/22' && echo parrot_ssh=reachable || echo parrot_ssh=unreachable
      - name: Check VPS services and Codex executable
        run: |
          timeout 20 tailscale ssh root@hermes 'systemctl is-active tailscaled ssh caddy becore-tickets; runuser -u ubuntu -- bash -lc "command -v codex || true"'
