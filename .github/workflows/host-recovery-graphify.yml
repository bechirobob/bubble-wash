name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Install and verify Graphify for the VPS user
        run: |
          timeout 240 tailscale ssh root@hermes 'bash -s' <<'ROOT'
          set -euo pipefail
          python3 -m venv --help >/dev/null
          runuser -u ubuntu -- bash -s <<'USER'
          set -euo pipefail
          cd /home/ubuntu
          mkdir -p .local/share/graphify .local/bin
          python3 -m venv .local/share/graphify/venv
          .local/share/graphify/venv/bin/python -m pip install --disable-pip-version-check 'graphifyy==0.9.74'
          if [ -e .local/bin/graphify ] && [ ! -L .local/bin/graphify ]; then
            echo 'Existing non-symlink graphify launcher needs inspection'; exit 1
          fi
          ln -sfn /home/ubuntu/.local/share/graphify/venv/bin/graphify .local/bin/graphify
          export PATH="/home/ubuntu/.local/bin:$PATH"
          graphify --version
          graphify --help
          .local/share/graphify/venv/bin/python -m pip check
          USER
          systemctl is-active tailscaled ssh caddy becore-tickets
          timeout 8 bash -c 'cat < /dev/null > /dev/tcp/100.74.152.91/22' && echo parrot_tcp_22=reachable || echo parrot_tcp_22=unreachable
          ROOT
