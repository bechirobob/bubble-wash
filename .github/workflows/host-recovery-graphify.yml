name: Host recovery and Graphify
on:
  push:
    branches: [ops/host-recovery-graphify-20261003]
    paths: [.github/workflows/host-recovery-graphify.yml]
permissions:
  contents: read
concurrency:
  group: host-recovery-graphify
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect existing tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Inspect access metadata for Parrot
        run: |
          tailscale debug netmap | python3 -c 'import json,sys; d=json.load(sys.stdin); names=("parrot.","hermes."); peers=d.get("Peers",[]); print(json.dumps({"targets":[{"name":p.get("Name"),"tags":p.get("Tags",[]),"userOwned":bool(p.get("User")) and not p.get("Tags"),"sshHostKeysAdvertised":bool(p.get("SSH_HostKeys")),"addresses":p.get("Addresses",[])} for p in peers if any(str(p.get("Name","")).startswith(n) for n in names)],"localPacketFilters":d.get("PacketFilter",[])},indent=2))'
      - name: Check real SSH response and connectivity
        run: |
          timeout 8 tailscale ping --c 1 --timeout 3s 100.74.152.91 || true
          timeout 15 ssh -vv -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes bechirob@100.74.152.91 true 2>&1 | tail -12 || true
      - name: Check Parrot access from Hermes
        run: |
          timeout 25 tailscale ssh root@hermes 'bash -s' <<'SH'
          timeout 15 ssh -vv -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes bechirob@100.74.152.91 true 2>&1 | tail -12 || true
          SH
