name: Production Launch Data Reset

on:
  workflow_run:
    workflows:
      - Production Deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: bubblewash-production
  cancel-in-progress: false

jobs:
  reset:
    name: Clear pre-production operational data
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to the production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes

      - name: Verify the exact deployed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deployed_sha="$(tailscale ssh root@hermes "awk -F= '/^sha=/{print \$2}' /home/ubuntu/bubblewash-runtime/current-release")"
          if [[ "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "Production is not running the release that triggered this reset." >&2
            exit 1
          fi

      - name: Clear pre-production operational records
        shell: bash
        run: |
          set -euo pipefail
          unit_name="bubblewash-production-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$RUNNER_TEMP/production-reset-report.json"
          tailscale ssh root@hermes \
            "systemd-run --quiet --wait --collect --pipe --unit='$unit_name' --property='User=ubuntu' --property='Group=ubuntu' --property='WorkingDirectory=/home/ubuntu/bubblewash-pilot' --property='EnvironmentFile=/home/ubuntu/.config/bubblewash/env' --property='Environment=HOME=/home/ubuntu' /usr/bin/env BUBBLEWASH_PRODUCTION_RESET_ID=production-launch-2026-08-29 BUBBLEWASH_ALLOW_PRODUCTION_RESET=production-launch-2026-08-29 /usr/bin/npm run --silent db:production-reset" \
            | tee "$report"
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!value.ok) process.exit(1)' "$report"
          printf 'RESET_REPORT=%s\n' "$report" >> "$GITHUB_ENV"

      - name: Store the non-sensitive reset report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubblewash-production-reset-${{ github.run_id }}
          path: ${{ env.RESET_REPORT }}
          if-no-files-found: error
          retention-days: 35

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /book /track /manage /staff /api/health /api/ready; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 15 --output /dev/null "https://bubblewash.co$path"
          done
