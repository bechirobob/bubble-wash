name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Read source work and private backup access
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import json,pathlib,urllib.request,urllib.error
          v=dict(l.split('=',1) for l in pathlib.Path('/etc/becore-tickets-fallback.env').read_text().splitlines() if '=' in l and not l.startswith('#'))
          token=v['CLOUDFLARE_API_TOKEN'].strip().strip('"\'')
          root='https://api.cloudflare.com/client/v4/accounts/af75a230de2eea882606db8d9acce473'
          def api(path,body=None):
           req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=json.dumps(body).encode() if body else None)
           with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)['result']
          print(json.dumps({'queueMetrics':api('/queues/4bcab6ba4d2447efa852e83c9091906c/metrics')}))
          for name,sql in {
           'queuedDeliveries':"SELECT COUNT(*) AS n FROM delivery_events WHERE status='queued'",
           'retryableFailures':"SELECT COUNT(*) AS n FROM delivery_events WHERE status='failed' AND attempt_count<3 AND next_attempt_at IS NOT NULL",
           'leasedHostAnnouncements':"SELECT COUNT(*) AS n FROM room_announcement_deliveries WHERE lease_token IS NOT NULL",
           'leasedMarketing':"SELECT COUNT(*) AS n FROM marketing_state WHERE lease_token IS NOT NULL",
           'claimedAnnouncements':"SELECT COUNT(*) AS n FROM event_announcement_recipients WHERE status='sending' OR (claimed_at IS NOT NULL AND status NOT IN ('sent','failed','suppressed'))"
          }.items():
           print(json.dumps({'check':name,'count':api('/d1/database/8f8723c2-673a-4aba-b025-83c05d67d075/query',{'sql':sql})[0]['results'][0]['n']}))
          try:
           buckets=api('/r2/buckets')
           print(json.dumps({'r2Accessible':True,'ticketsBackupExists':any(b.get('name')=='becore-tickets-backups' for b in buckets.get('buckets',[]))}))
          except urllib.error.HTTPError as e:print(json.dumps({'r2Accessible':False,'http':e.code}))
          PY
