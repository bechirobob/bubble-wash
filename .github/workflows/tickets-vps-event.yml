name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Inspect current writer, transfer journal and backup evidence without changes
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import json,pathlib,subprocess,urllib.request,shutil
          for name in ['becore-tickets.service','becore-tickets-preview.service','becore-tickets-fallback.timer']:
            state=subprocess.run(['systemctl','show',name,'--property=ActiveState,WorkingDirectory','--no-pager'],capture_output=True,text=True)
            print(json.dumps({'service':name,'state':state.stdout.strip()}))
          for filename,fields in [
            ('/var/lib/becore-tickets-handover/live-transfer.json',['revision','phase','preparedAt','capturedAt','activatedAt','evidence']),
            ('/var/backups/becore-tickets/offhost.json',['runId','encrypted','restoreTested','retentionDays'])]:
            p=pathlib.Path(filename)
            value=json.loads(p.read_text()) if p.exists() else {}
            print(json.dumps({'record':p.name,'exists':p.exists(),'summary':{k:value[k] for k in fields if k in value}}))
          try:
            req=urllib.request.Request('http://127.0.0.1:3119/healthz',headers={'Host':'tickets.becoreops.com'})
            with urllib.request.urlopen(req,timeout=5) as response: health=json.load(response)
            print(json.dumps({'productionHealth':{k:health.get(k) for k in ['active','runtime','revision']}}))
          except Exception: print(json.dumps({'productionHealthReachable':False}))
          print(json.dumps({'freeBytes':shutil.disk_usage('/').free,'backupFiles':len(list(pathlib.Path('/var/backups/becore-tickets').glob('tickets-*.enc')))}))
          PY
