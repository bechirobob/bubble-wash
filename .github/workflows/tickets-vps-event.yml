name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Check out exact Tickets operator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: ad44bb16b34885e7c3f3ed829f00d9c8b646b11a
          persist-credentials: false
      - name: Verify disposable database transport and inherited bindings
        shell: bash
        run: |
          set -euo pipefail
          stage="/var/tmp/tickets-operator-$GITHUB_RUN_ID"
          trap 'tailscale ssh root@hermes "rm -rf -- $stage"' EXIT
          tailscale ssh root@hermes "install -d -m 700 '$stage'"
          tar -czf - ops/handover worker/handover-control.ts package.json | tailscale ssh root@hermes "tar -xzf - -C '$stage'"
          tailscale ssh root@hermes "python3 - '$stage' '$GITHUB_RUN_ID'" <<'PY'
          import os,pathlib,sys
          stage,run_id=sys.argv[1:]
          values=dict(line.split('=',1) for line in pathlib.Path('/etc/becore-tickets-fallback.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          env=dict(os.environ)
          env['CLOUDFLARE_API_TOKEN']=values['CLOUDFLARE_API_TOKEN'].strip().strip('"\'')
          env['GITHUB_RUN_ID']=run_id
          os.chdir(stage)
          os.execve('/srv/becore-tickets/current/bin/node',['node','ops/handover/operator-smoke.mjs'],env)
          PY
      - name: Verify origin certificate chain without changing DNS
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes 'bash -s' <<'SH'
          set -euo pipefail
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          curl --fail --silent --show-error https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem -o "$cert"
          code="$(curl --silent --show-error --cacert "$cert" --resolve tickets.becoreops.com:443:127.0.0.1 --output /dev/null --write-out '%{http_code}' https://tickets.becoreops.com/)"
          test "$code" = 503
          echo 'Tickets origin TLS chain verified; maintenance response 503; public DNS unchanged.'
          SH
