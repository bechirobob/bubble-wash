name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Inspect origin certificate support
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import pathlib,json,subprocess,shutil
          p=pathlib.Path('/etc/caddy/becore-tickets-fallback.caddy')
          if p.exists(): print(json.dumps({'fallbackCaddy':p.read_text()}))
          modules=subprocess.check_output(['caddy','list-modules'],text=True)
          print(json.dumps({'cloudflareDnsModule':'dns.providers.cloudflare' in modules,'certbot':shutil.which('certbot'),'certbotConfigExists':pathlib.Path('/etc/letsencrypt/renewal').exists()}))
          print(json.dumps({'node':subprocess.check_output(['/srv/becore-tickets/current/bin/node','--version'],text=True).strip()}))
          PY
