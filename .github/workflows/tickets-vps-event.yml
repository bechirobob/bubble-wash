name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Prepare maintenance-only Tickets TLS origin
        run: |
          tailscale ssh root@hermes 'bash -s' <<'REMOTE'
          set -eu
          work=$(mktemp -d /var/lib/becore-tickets-handover/origin-XXXXXX)
          trap 'rm -rf "$work"' EXIT
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/bechirobob/tickets/6bda273f4d6e7c6fe9139986d490266c270e3166/ops/vps/prepare-origin.py' -o "$work/prepare-origin.py"
          python3 "$work/prepare-origin.py"
          REMOTE
