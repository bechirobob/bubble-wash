name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Inspect Tickets rehearsal storage only
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import pathlib,json,os,subprocess
          root=pathlib.Path('/var/lib/becore-tickets-handover')
          for p in sorted(root.iterdir()):
              total=0; files=0
              if p.is_dir() and not p.is_symlink():
                  for base,dirs,names in os.walk(p,followlinks=False):
                      for name in names:
                          q=pathlib.Path(base)/name
                          if not q.is_symlink():
                              total+=q.stat().st_size; files+=1
              elif p.is_file(): total=p.stat().st_size; files=1
              print(json.dumps({'path':str(p),'bytes':total,'files':files,'symlink':p.is_symlink()}))
          for unit in ['becore-tickets-preview.service','becore-tickets.service']:
              r=subprocess.run(['systemctl','cat',unit],capture_output=True,text=True)
              for line in r.stdout.splitlines():
                  if line.startswith('WorkingDirectory=') or 'TICKETS_STATE=' in line:
                      print(json.dumps({'unit':unit,'stateSetting':line}))
          print(subprocess.check_output(['df','-B1','/var/lib'],text=True))
          PY
