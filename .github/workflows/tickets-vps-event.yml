name: Inspect Tickets VPS cutover prerequisites
on:
  push:
    branches: [ops/tickets-vps-event-20260928]
    paths: [.github/workflows/tickets-vps-event.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Remove obsolete isolated preview state
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import pathlib,json,os,shutil,subprocess,urllib.request,sqlite3,datetime
          root=pathlib.Path('/var/lib/becore-tickets-preview')
          revision='5807f6ea9a7baef998cf379dc298ce636caf1f60'
          health_url=urllib.request.Request('http://127.0.0.1:3118/healthz',headers={'Host':'tickets.becoreops.com'})
          with urllib.request.urlopen(health_url,timeout=10) as response: health=json.load(response)
          assert health['revision']==revision and health['active'] is False
          unit=subprocess.check_output(['systemctl','cat','becore-tickets-preview.service'],text=True)
          settings=[line for line in unit.splitlines() if line.startswith('Environment=TICKETS_STATE=')]
          assert settings[-1]=='Environment=TICKETS_STATE='+str(root/revision)
          assert not root.is_symlink()
          names=['31989632c066fc5f6673353832483f9cde670fc0','4e04e464a9e1f1c21658653e9fa06d5cc1eef165','4f70f500d09dc43ddb8a36b6f7231c261333eb4e','79fa5e68f9e7d5b90cf5f47a8bea9e0ac95c84d4','9ccd03621306e9dc7d41b4bef2a6a813c4105464','a947aee5e3274b8812ffade5b63817c5b4804c69','operations.sqlite','tickets.sqlite','rooms']
          targets=[root/name for name in names]
          for p in targets: assert not p.is_symlink()
          for process in pathlib.Path('/proc').glob('[0-9]*'):
              for fd in (process/'fd').glob('*'):
                  try: opened=os.readlink(fd)
                  except OSError: continue
                  assert not any(opened==str(p) or opened.startswith(str(p)+'/') for p in targets),'Preview state in use'
          removed=[]
          for p in targets:
              if not p.exists(): continue
              size=sum(q.stat().st_size for q in p.rglob('*') if q.is_file() and not q.is_symlink()) if p.is_dir() else p.stat().st_size
              if p.is_dir(): shutil.rmtree(p)
              else: p.unlink()
              removed.append({'name':p.name,'bytes':size})
          db=sqlite3.connect('file:'+str(root/revision/'tickets.sqlite')+'?mode=ro',uri=True)
          counts={}
          for name in ['orders','tickets','registrations']:
              if db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(name,)).fetchone():
                  counts[name]=db.execute('SELECT COUNT(*) FROM "'+name+'"').fetchone()[0]
          db.close()
          with urllib.request.urlopen(health_url,timeout=10) as response: health=json.load(response)
          assert health['active'] is False and health['revision']==revision
          report_file=pathlib.Path('/var/lib/becore-tickets-handover/standby-verification.json')
          report=json.loads(report_file.read_text())
          report['obsoletePreviewCleanup']={'removed':removed,'activePreviewPreserved':revision,'activePreviewCounts':counts}
          tmp=report_file.with_suffix('.pending')
          with open(tmp,'w',opener=lambda p,f:os.open(p,f,0o600)) as f:
              json.dump(report,f,indent=2); f.flush(); os.fsync(f.fileno())
          os.replace(tmp,report_file)
          print(json.dumps({'previewCleanup':report['obsoletePreviewCleanup'],'diskFreeBytes':shutil.disk_usage(root).free,'previewHealthy':True,'productionChanged':False}))
          PY
