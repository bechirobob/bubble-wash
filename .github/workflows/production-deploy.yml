name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubblewash-production
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect production host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to the production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes

      - name: Inspect the production runtime
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes bash -s <<'REMOTE'
          set -euo pipefail

          echo "Host: $(hostname)"
          echo "Kernel: $(uname -sr)"
          echo "Uptime: $(uptime -p)"

          echo "Running web-related services:"
          systemctl list-units --type=service --state=running --no-pager \
            | grep -Ei 'bubble|caddy|docker|nginx|node|pm2' || true

          echo "Listening web ports:"
          ss -lntp | grep -E ':(80|443|3000|3001|8080|8100)([[:space:]]|$)' || true

          echo "Web-related processes:"
          ps -eo user,pid,comm,args \
            | grep -Ei 'bubble|caddy|next-server|node|pm2' \
            | grep -v grep || true

          if command -v docker >/dev/null 2>&1; then
            echo "Running containers:"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            echo "Compose metadata:"
            docker ps -q | xargs -r docker inspect \
              --format '{{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}} config={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          fi

          echo "Likely Bubble Wash directories:"
          find /home /opt /root /srv /var/www -maxdepth 5 -type d \
            \( -iname '*bubble*wash*' -o -iname 'bubble-wash' \) 2>/dev/null | sort -u || true

          echo "Bubble Wash Caddy routes:"
          grep -n -i -B 2 -A 12 'bubblewash' /etc/caddy/Caddyfile 2>/dev/null || true

          echo "Bubble Wash service definitions:"
          grep -RIl -m 1 'bubblewash\|bubble-wash' \
            /etc/systemd/system /home/*/.config/systemd/user 2>/dev/null | sort -u || true

          service_file=/home/ubuntu/.config/systemd/user/bubblewash-local.service
          echo "Bubble Wash service metadata:"
          if [[ -f "$service_file" ]]; then
            grep -E '^(Description|WorkingDirectory|ExecStart|EnvironmentFile|Restart|WantedBy)=' \
              "$service_file" || true
          fi

          repo_dir=/home/ubuntu/projects/bubble-wash
          echo "Bubble Wash repository:"
          if git -C "$repo_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$repo_dir" rev-parse HEAD
            git -C "$repo_dir" status --short --branch
            git -C "$repo_dir" remote get-url origin
            git -C "$repo_dir" rev-parse --show-toplevel
          fi

          echo "Bubble Wash path metadata:"
          for path in \
            "$repo_dir" \
            /home/ubuntu/bubblewash-runtime \
            /home/ubuntu/bubblewash-backups \
            /home/ubuntu/bubblewash-releases \
            /home/ubuntu/bubblewash-rollbacks \
            /home/ubuntu/.config/bubblewash; do
            if [[ -e "$path" ]]; then
              stat -c '%n|%F|%U:%G|%a' "$path"
            fi
          done

          echo "Runtime layout (names and sizes only):"
          find /home/ubuntu/bubblewash-runtime -maxdepth 2 -mindepth 1 \
            \( -type d -o -type f -o -type l \) \
            -printf '%y %p %s bytes\n' 2>/dev/null | sort || true

          echo "Database candidates (names and sizes only):"
          find \
            /home/ubuntu/.config/bubblewash \
            /home/ubuntu/bubblewash-runtime \
            "$repo_dir" \
            -maxdepth 4 -type f \
            \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) \
            -printf '%p %s bytes\n' 2>/dev/null | sort || true
          REMOTE
