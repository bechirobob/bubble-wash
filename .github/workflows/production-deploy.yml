name: Production Deploy

on:
  workflow_run:
    workflows:
      - Pilot CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubblewash-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Connect to the production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes

      - name: Package and deploy the release
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The deployment revision is not a full commit SHA." >&2
            exit 1
          fi

          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${TARGET_SHA:0:12}"
          release_dir="/home/ubuntu/bubblewash-releases/$release_id"
          archive="$RUNNER_TEMP/bubblewash-release.tgz"

          tar \
            --exclude-vcs \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='response.tmp' \
            -czf "$archive" .

          tailscale ssh root@hermes \
            "install -d -o ubuntu -g ubuntu -m 0750 '$release_dir'"
          tailscale ssh root@hermes \
            "tar -xzf - -C '$release_dir' && chown -R ubuntu:ubuntu '$release_dir'" \
            < "$archive"
          tailscale ssh root@hermes \
            "bash '$release_dir/ops/deploy-production.sh' '$release_dir' '$TARGET_SHA'"

      - name: Verify the public release
        shell: bash
        run: |
          set -euo pipefail
          for path in / /services /book /track /manage /early-access /api/health /api/ready; do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --max-time 15 \
              --output /dev/null \
              "https://bubblewash.co$path"
          done
