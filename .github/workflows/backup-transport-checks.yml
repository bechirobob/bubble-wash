      - src/app/support/page.tsx
      - src/app/vendors/page.tsx
      - src/components/StaffWorkspaces.tsx
      - src/lib/admin-mfa.ts
      - src/lib/auth.ts
      - src/lib/availability-store.ts
      - src/lib/data-store.ts
      - src/lib/operational-store.ts
      - src/lib/order-workflow.ts
      - src/lib/staff-accounts.ts
      - src/lib/staff-identity.ts
      - tests/personal-owner-http.integration.mjs
      - tests/personal-owner-mfa.integration.mjs
      - tests/personal-owner.integration.mjs
      - tests/worker-workspaces.test.mjs
      - tests/readiness-readonly.fixture.mjs
      - tests/readiness-readonly.test.mjs
      - tests/owner-enrollment-preservation.fixture.mjs
      - tests/owner-enrollment-preservation.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/pilot-ci.yml
      - .github/backup/**
      - .github/workflows/backup-transport-checks.yml
      - .github/workflows/nightly-backup.yml
      - .github/workflows/production-deploy.yml
      - ops/deploy-preserving.py
      - ops/check-release-ci.py
      - tests/test_preserving_deploy.py
      - .github/workflows/owner-enrollment.yml
      - scripts/owner-enrollment-host.py
      - ops/owner-enrollment-source-pins.json
      - scripts/release-preflight.py
      - .github/workflows/release-preflight.yml
      - .github/workflows/owner-code-deploy.yml
      - ops/deploy-personal-owner.py
      - ops/check-owner-source.py
      - ops/integration-release/**
      - public/**
      - db/**
      - scripts/**
      - tests/**
      - ops/**
      - .github/**
      - tooling/**
      - docs/**
      - integration-evidence/**
      - eslint.config.mjs
      - playwright.config.mjs
      - README.md
      - DESIGN.md
      - .env.production.example
      - .gitignore
      - ops/owner-enrollment-integration-pins.json
      - ops/check-owner-enrollment-source.py
      - docs/OWNER_ENROLLMENT_INTEGRATION_CONTRACT.md
      - scripts/owner-enrollment-source-contract.py
      - .github/backup/test_owner_enrollment_contract.py
      - tests/test_integration_release_adapter.py
      - .github/workflows/integration-code-deploy.yml
      - tests/test_owner_deploy.py
      - .github/workflows/restore-staff-access.yml
      - .github/workflows/staff-access-checks.yml
      - scripts/restore-staff-access.py
      - tests/test_staff_restore.py
      - src/**
      - package-lock.json
      - tsconfig.json
      - src/app/api/admin/mfa/enroll/route.ts
      - src/app/api/login/route.ts
      - src/components/LoginPage.tsx
      - tests/browser/personal-owner-mfa.spec.mjs
      - docs/PERSONAL_OWNER_ENROLLMENT.md
      - next.config.mjs
      - package.json
      - scripts/invite-additional-owner.mjs
      - src/app/admin/page.tsx
      - src/app/api/health/route.ts
      - src/app/api/orders/advance/route.ts
      - src/app/api/ready/route.ts
      - src/app/api/staff/accounts/route.ts
      - src/app/drivers/page.tsx
      - src/app/support/page.tsx
      - src/app/vendors/page.tsx
      - src/components/StaffWorkspaces.tsx
      - src/lib/admin-mfa.ts
      - src/lib/auth.ts
      - src/lib/availability-store.ts
      - src/lib/data-store.ts
      - src/lib/operational-store.ts
      - src/lib/order-workflow.ts
      - src/lib/staff-accounts.ts
      - src/lib/staff-identity.ts
      - tests/personal-owner-http.integration.mjs
      - tests/personal-owner-mfa.integration.mjs
      - tests/personal-owner.integration.mjs
      - tests/worker-workspaces.test.mjs
      - tests/readiness-readonly.fixture.mjs
      - tests/readiness-readonly.test.mjs
      - tests/owner-enrollment-preservation.fixture.mjs
      - tests/owner-enrollment-preservation.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify encrypted-only transport and failure guards
        run: |
          python3 -m unittest discover -s .github/backup -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_preserving_deploy.py' -v
          python3 -m unittest discover -s tests -p 'test_owner_deploy.py' -v
          python3 ops/integration-release/select_source.py --release .
          python3 ops/check-owner-enrollment-source.py --verify-runner
          python3 -m unittest discover -s tests -p 'test_integration_release_adapter.py' -v
          python3 -m py_compile .github/backup/backup_release.py ops/deploy-preserving.py ops/check-release-ci.py ops/deploy-personal-owner.py ops/check-owner-source.py
          git diff --check

