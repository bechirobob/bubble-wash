name: Browser workflow regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full release gate or focused synthetic GPS development check
        type: choice
        required: true
        default: full
        options: [full, gps]
permissions:
  contents: read
concurrency:
  group: browser-regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'gps' || 'full' }}
  cancel-in-progress: true
jobs:
  browser:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'gps-development' || 'browser' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUBBLEWASH_ADMIN_MFA_REQUIRED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_AUTOMATED_UPDATES_ENABLED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_ONLINE_PAYMENTS_ENABLED: 'false'
    steps:
      - name: Refuse focused GPS mode on the production branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && github.ref == 'refs/heads/main' }}
        run: |
          echo 'Focused GPS checks cannot satisfy the production full Browser gate.' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Set up Python for the existing synthetic survey fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify prepared browsers and native modules
        run: node scripts/verify-browser-environment.mjs
      - name: Verify fixture egress guard
        run: node --test tests/browser-egress.test.mjs
      - name: Build production runtime for synthetic test data
        id: build
        run: npm run build
      - name: Verify owner-only results with synthetic responses and capture previews
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: |
          set -euo pipefail
          node --conditions=react-server --experimental-strip-types --experimental-loader=./tests/alias-loader.mjs tests/browser/start-results-fixture.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3217/login >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          node tests/research-results-http.mjs
          node tests/browser/research-results-proof.mjs
      - name: Verify synthetic edge, logins, cookies, redirects and script assets
        run: node tests/browser/fixture-smoke.mjs
      - name: Verify staff alignment and customer request retries across all projects
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: npx playwright test tests/browser/staff-service-desk.spec.mjs tests/browser/customer-alignment.spec.mjs tests/browser/customer-request-retry.spec.mjs tests/browser/public-service-journeys.spec.mjs
      - name: Run four-role journeys at mobile and desktop sizes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: npx playwright test
      - name: Run focused authenticated GPS lifecycle across all four projects
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' }}
        run: npx playwright test tests/browser/staff-workflow.spec.mjs --grep 'authenticated GPS lifecycle with held requests and explicit resume$'
      - name: Verify synthetic worklist fixture and role boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'gps') }}
        run: npm run test:worklist-fixture
      - name: Run staff worklist interactions at mobile and desktop sizes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'gps') }}
        run: npm run test:browser-worklists
      - name: Build isolated open-survey fixture (never a deployment artifact)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: |
          python3 - <<'PYTEST'
          import re
          from pathlib import Path
          p = Path('src/lib/research/policy.ts')
          text = p.read_text()
          for flag in ['launchApproved', 'deliveryApproved', 'retentionReviewApproved']:
              text, count = re.subn(r'(export const ' + flag + r': boolean = )(?:false|true);', r'\g<1>true;', text)
              if count != 1:
                  raise RuntimeError('Expected exactly one research policy flag: ' + flag)
          p.write_text(text)
          PYTEST
          npm run build
      - name: Run isolated open-survey browser and edge acceptance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        env:
          BUBBLEWASH_TEST_RESEARCH_OPEN: 'true'
        run: npx playwright test tests/browser/opening-intro.spec.mjs --grep 'interim survey open-fixture acceptance|open survey fixture rejects' --output=test-results/survey-browser
      - name: Preserve synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'synthetic-gps-development-screenshots' || 'synthetic-browser-screenshots' }}
          path: |
            test-results/browser/**/*.png
            test-results/browser/**/error-context.md
            test-results/survey-browser/**/*.png
            test-results/survey-results/*.png
            test-results/survey-results/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic worklist screenshots for review
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'gps') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-staff-worklist-screenshots
          path: test-results/worklists/**/*.png
          if-no-files-found: error
          retention-days: 7
