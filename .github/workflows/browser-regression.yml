name: Browser workflow regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full release gate or focused synthetic GPS development check
        type: choice
        required: true
        default: full
        options: [full, gps]
permissions:
  contents: read
concurrency:
  group: browser-regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'gps' || 'full' }}
  cancel-in-progress: true
jobs:
  browser:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'gps-development' || 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUBBLEWASH_ADMIN_MFA_REQUIRED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_AUTOMATED_UPDATES_ENABLED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_ONLINE_PAYMENTS_ENABLED: 'false'
    steps:
      - name: Refuse focused GPS mode on the production branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && github.ref == 'refs/heads/main' }}
        run: |
          echo 'Focused GPS checks cannot satisfy the production full Browser gate.' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Prefer the existing official Ubuntu archive mirror
        timeout-minutes: 1
        run: |
          sudo python3 - <<'PY'
          import os
          import re
          import stat

          def checked_open(path, mode):
              flags = os.O_RDONLY if mode == 'r' else os.O_RDWR
              fd = os.open(path, flags | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                      raise RuntimeError('Expected a root-owned regular APT file without group/other write access')
                  return os.fdopen(fd, mode, encoding='utf-8', newline='')
              except BaseException:
                  os.close(fd)
                  raise

          with checked_open('/etc/apt/sources.list.d/ubuntu.sources', 'r') as source:
              text = source.read(65537)
          fields = re.findall(r'^URIs:[^\n]*(?:\n[ \t]+[^\n]*)*', text, re.MULTILINE | re.IGNORECASE)
          if len(text) > 65536 or not fields or any(
              field.split(':', 1)[1].split() != ['mirror+file:/etc/apt/apt-mirrors.txt'] for field in fields
          ):
              raise RuntimeError('Unexpected Ubuntu APT mirror reference')

          # Runner image ubuntu24/20261012.334: preserve all existing sources and trust.
          expected = (
              'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
              'https://archive.ubuntu.com/ubuntu/\tpriority:2\n'
              'https://security.ubuntu.com/ubuntu/\tpriority:3\n'
          )
          preferred = expected.replace('priority:1', 'priority:2', 1).replace(
              'https://archive.ubuntu.com/ubuntu/\tpriority:2',
              'https://archive.ubuntu.com/ubuntu/\tpriority:1', 1
          )
          with checked_open('/etc/apt/apt-mirrors.txt', 'r+') as mirrors:
              if mirrors.read(len(expected) + 1) != expected:
                  raise RuntimeError('Unexpected Ubuntu APT mirrors or priorities')
              mirrors.seek(0)
              mirrors.write(preferred)
          PY
      - name: Install official test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify fixture egress guard
        run: node --test tests/browser-egress.test.mjs
      - name: Build production runtime for synthetic test data
        run: npm run build
      - name: Verify owner-only results with synthetic responses and capture previews
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: |
          set -euo pipefail
          node --conditions=react-server --experimental-strip-types --experimental-loader=./tests/alias-loader.mjs tests/browser/start-results-fixture.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3217/login >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          node tests/research-results-http.mjs
          node tests/browser/research-results-proof.mjs
      - name: Verify synthetic edge, logins, cookies, redirects and script assets
        run: node tests/browser/fixture-smoke.mjs
      - name: Run four-role journeys at mobile and desktop sizes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        run: npm run test:browser
      - name: Run focused authenticated GPS lifecycle across all four projects
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' }}
        run: npx playwright test tests/browser/staff-workflow.spec.mjs --grep 'authenticated GPS lifecycle with held requests and explicit resume$'
      - name: Verify open survey with isolated synthetic storage
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'gps' }}
        env:
          BUBBLEWASH_TEST_RESEARCH_OPEN: 'true'
        run: npx playwright test tests/browser/opening-intro.spec.mjs --grep "open-fixture acceptance|open survey fixture rejects" --output test-results/open-survey
      - name: Preserve synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gps' && 'synthetic-gps-development-screenshots' || 'synthetic-browser-screenshots' }}
          path: |
            test-results/browser/**/*.png
            test-results/open-survey/**/*.png
            test-results/survey-results/*.png
            test-results/survey-results/results.json
          if-no-files-found: ignore
          retention-days: 7
