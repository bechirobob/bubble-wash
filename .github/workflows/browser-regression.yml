name: Browser workflow regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUBBLEWASH_ADMIN_MFA_REQUIRED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_AUTOMATED_UPDATES_ENABLED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_ONLINE_PAYMENTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Install official test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify fixture egress guard
        run: node --test tests/browser-egress.test.mjs
      - name: Build production runtime for synthetic test data
        run: npm run build
      - name: Run four-role journeys at mobile and desktop sizes
        run: npm run test:browser
