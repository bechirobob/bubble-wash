name: Browser workflow regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUBBLEWASH_ADMIN_MFA_REQUIRED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_AUTOMATED_UPDATES_ENABLED: 'false'
      NEXT_PUBLIC_BUBBLEWASH_ONLINE_PAYMENTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Prefer the existing official Ubuntu archive mirror
        timeout-minutes: 1
        run: |
          sudo python3 - <<'PY'
          import os
          import re
          import stat

          def checked_open(path, mode):
              flags = os.O_RDONLY if mode == 'r' else os.O_RDWR
              fd = os.open(path, flags | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                      raise RuntimeError('Expected a root-owned regular APT file without group/other write access')
                  return os.fdopen(fd, mode, encoding='utf-8', newline='')
              except BaseException:
                  os.close(fd)
                  raise

          with checked_open('/etc/apt/sources.list.d/ubuntu.sources', 'r') as source:
              text = source.read(65537)
          fields = re.findall(r'^URIs:[^\n]*(?:\n[ \t]+[^\n]*)*', text, re.MULTILINE | re.IGNORECASE)
          if len(text) > 65536 or not fields or any(
              field.split(':', 1)[1].split() != ['mirror+file:/etc/apt/apt-mirrors.txt'] for field in fields
          ):
              raise RuntimeError('Unexpected Ubuntu APT mirror reference')

          # Runner image ubuntu24/20261012.334: preserve all existing sources and trust.
          expected = (
              'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
              'https://archive.ubuntu.com/ubuntu/\tpriority:2\n'
              'https://security.ubuntu.com/ubuntu/\tpriority:3\n'
          )
          preferred = expected.replace('priority:1', 'priority:2', 1).replace(
              'https://archive.ubuntu.com/ubuntu/\tpriority:2',
              'https://archive.ubuntu.com/ubuntu/\tpriority:1', 1
          )
          with checked_open('/etc/apt/apt-mirrors.txt', 'r+') as mirrors:
              if mirrors.read(len(expected) + 1) != expected:
                  raise RuntimeError('Unexpected Ubuntu APT mirrors or priorities')
              mirrors.seek(0)
              mirrors.write(preferred)
          PY
      - name: Install official test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify fixture egress guard
        run: node --test tests/browser-egress.test.mjs
      - name: Build production runtime for synthetic test data
        id: build
        run: npm run build
      - name: Verify synthetic edge, logins, cookies, redirects and script assets
        run: node tests/browser/fixture-smoke.mjs
      - name: Run four-role journeys at mobile and desktop sizes
        run: npx playwright test
      - name: Verify synthetic worklist fixture and role boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:worklist-fixture
      - name: Run staff worklist interactions at mobile and desktop sizes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser-worklists
      - name: Preserve synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-screenshots
          path: test-results/browser/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic worklist screenshots for review
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-staff-worklist-screenshots
          path: test-results/worklists/**/*.png
          if-no-files-found: error
          retention-days: 7
