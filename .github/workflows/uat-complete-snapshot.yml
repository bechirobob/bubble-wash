name: Complete verified UAT snapshot recovery
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit for guarded UAT snapshot completion
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bubblewash-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/bubble-wash' && github.ref == 'refs/heads/main'
    environment: backup-storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require exact reviewed source and first attempt
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test guarded snapshot continuation
        run: python3 -B -m unittest discover -s ops/uat/update -p 'test_*.py' -v
      - name: Require the exact staged candidate release checks
        env:
          TARGET_SHA: 8bd37b028b550967f9a3eefcd60a52cbcb4f2da9
        run: python3 -B ops/check-release-ci.py
      - name: Connect through the existing approved tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Complete approved extension and fixed build once
        run: python3 -B ops/uat/update/complete_snapshot_runner.py
