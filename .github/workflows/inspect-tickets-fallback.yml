name: Inspect Tickets fallback connection
on:
  push:
    branches: [ops/inspect-tickets-fallback]
    paths: [.github/workflows/inspect-tickets-fallback.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect to the existing VPS
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Inspect secure activation connection
        run: |
          tailscale ssh root@hermes 'bash -s' <<'REMOTE'
          set -eu
          /usr/sbin/sshd -T | awk '$1 ~ /^(port|permitrootlogin|pubkeyauthentication|authorizedkeysfile|allowusers|denyusers|listenaddress)$/'
          cat /etc/ssh/ssh_host_ed25519_key.pub
          systemctl is-active becore-tickets-fallback.timer || true
          REMOTE
          python3 - <<'PY'
          import socket
          with socket.create_connection(('51.195.20.137',22),timeout=10) as connection:
              print('Public SSH connection:',connection.recv(128).decode().strip())
          PY
