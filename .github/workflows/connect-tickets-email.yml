name: Prepare Tickets mail connection
on:
  push:
    branches: [ops/connect-tickets-email]
    paths: [.github/workflows/connect-tickets-email.yml, ops/tickets-mail-preflight.py]
permissions:
  contents: read
concurrency:
  group: hermes-mail-connection
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Connect through the existing VPS access path
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Inspect mail setup prerequisites and existing provider access
        run: tailscale ssh root@hermes 'timeout 75 python3 -' < ops/tickets-mail-preflight.py
