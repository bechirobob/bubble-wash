name: Prepare Tickets mail connection
on:
  push:
    branches: [ops/connect-tickets-email]
    paths: [.github/workflows/connect-tickets-email.yml, ops/tickets-mail-preflight.py]
permissions:
  contents: read
concurrency:
  group: hermes-mail-connection
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bechirobob/tickets
          ref: 420982eff81078270a147a41b41de34cb4ff2b3e
          path: tickets-source
          persist-credentials: false
      - name: Check the exact mail service source
        run: python3 -m unittest discover -s tickets-source/ops/email -p 'test_*.py' -v
      - name: Connect through the existing VPS access path
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: hermes
      - name: Verify HTTPS, DNS, authentication and the paused state without sending mail
        run: tailscale ssh root@hermes 'python3 -' < tickets-source/ops/email/verify.py
      - name: Check real SMTP queue acceptance and DKIM without transmitting mail
        run: tailscale ssh root@hermes 'docker exec -i becore-tickets-mail python3 -' < tickets-source/ops/email/smoke.py
