name: Install isolated Tickets VPS runtime
on:
  push:
    branches: [ops/inspect-tickets-fallback]
    paths: [.github/workflows/install-tickets-runtime.yml]
permissions:
  contents: read
concurrency:
  group: tickets-vps-install
  cancel-in-progress: true
jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Paused by owner. No deployment operations will run.'
