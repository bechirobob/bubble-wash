# Weekly update proposals only; dependency adoption requires review.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Africa/Accra
  open-pull-requests-limit: 2
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Africa/Accra
  open-pull-requests-limit: 1
